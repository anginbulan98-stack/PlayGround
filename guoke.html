<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guoke — Demo Integrasi Upload TikTok Quality</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b0d12;--sf:#141821;--sf2:#1c2230;--tx:#eef1f6;--mu:#8b94a7;--ac:#2d7ff9;--ok:#2ecc71;--bd:#232a3a;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 90px;display:none}
.scr.on{display:block}
h1{font-size:22px;margin:6px 0 14px}h2{font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.row a{color:var(--ac);font-size:12px;cursor:pointer}
.search{display:flex;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;color:var(--mu)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font-size:14px}
.tabs{display:flex;gap:18px;margin:12px 0;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.tabs b{padding:6px 0;color:var(--mu);font-weight:500;cursor:pointer;white-space:nowrap}
.tabs b.on{color:var(--tx);border-bottom:2px solid var(--ac)}
.hero{height:190px;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.75))}
.hero>*{position:relative;z-index:1;color:#fff}.hero h2{font-size:20px}.hero p{font-size:12px;opacity:.85}
.dots{display:flex;gap:5px;justify-content:center;margin-top:8px}.dots i{width:5px;height:5px;border-radius:9px;background:var(--bd)}.dots i.on{width:16px;background:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer}
.scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pst{flex:none;width:112px;cursor:pointer}.pst .im,.im{aspect-ratio:3/4;border-radius:12px;position:relative}
.pst p{margin-top:6px;font-size:12px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bdg{position:absolute;top:6px;left:6px;background:var(--ac);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding:8px 0;z-index:5}
.nav div{flex:1;text-align:center;font-size:10px;color:var(--mu);cursor:pointer}.nav div.on{color:var(--ac)}
.nav span{display:block;font-size:20px;line-height:1.2}
.ovl{position:absolute;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none;padding-bottom:30px}.ovl.on{display:block}
.top{display:flex;justify-content:space-between;padding:12px 16px;position:absolute;left:0;right:0;z-index:2}
.rb{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:0;font-size:16px;cursor:pointer}
.pro{border-radius:16px;background:linear-gradient(90deg,#1b5fd0,#2d7ff9);padding:16px;color:#fff;margin:14px 0}
.sh{font-size:11px;letter-spacing:.08em;color:var(--mu);margin:18px 4px 8px;font-weight:600}
.sg{background:var(--sf);border-radius:14px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 12px}.brand b{font-size:20px}
.demo-note{background:var(--sf);border:1px dashed var(--ac);border-radius:12px;padding:10px 12px;font-size:11px;color:var(--mu);margin-bottom:4px}
.demo-note b{color:var(--tx)}
.im{overflow:hidden;background-size:cover;background-position:center}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="app">
<section class="scr on" id="beranda"></section>
<section class="scr" id="jelajahi"></section>
<nav class="nav" id="nav"></nav>
</div>
<script>
/* Data contoh sesuai struktur asli Guoke (k:"Manhwa" vs tanpa k = Anime) */
const A=[
{t:"March comes in like a lion",g:"Drama",c:["#2b5876","#4e4376"],r:8.1,y:2016,n:22,d:"Sen",tm:"00:00",s:"Tayang",sy:"Pemain shogi muda menemukan kehangatan di meja makan tepi sungai.",img:"https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/bx21366-0wrYK0kjKeFn.jpg"},
{t:"Magical Girl Raising Project",g:"Action",c:["#7b2d5b","#e8769c"],r:6.5,y:2016,n:12,d:"Sel",tm:"00:00",s:"Tayang",sy:"Enam belas Magical Girl dikumpulkan dalam permainan mematikan.",img:"https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/bx21340-0fOhJK8Qynmy.jpg"},
{t:"The Cold Sato-san Is Only Sweet to Me",g:"Romance",c:["#3a7bd5","#00d2ff"],r:7.4,y:2026,n:2,d:"Sel",tm:"18:30",s:"Segera",sy:"Sato yang dingin ternyata hanya manis kepadamu."},
{t:"Nia Liston: The Merciless Maiden",g:"Fantasy",c:["#41295a","#2f0743"],r:7.9,y:2026,n:2,d:"Sel",tm:"19:25",s:"Segera",sy:"Gadis tanpa ampun di dunia sihir yang kejam."},
{t:"Super Psychic Policeman Chojo",g:"Comedy",c:["#f7971e","#ffd200"],r:7.1,y:2026,n:2,d:"Sel",tm:"21:00",s:"Segera",sy:"Polisi berkekuatan super yang kerap bikin kekacauan."},
{t:"Battle Spirits",g:"Action",c:["#232526","#b21f1f"],r:6.9,y:2026,n:2,d:"Sel",tm:"21:00",s:"Segera",sy:"Pertarungan kartu penentu nasib dua dunia."},
{t:"Solo Leveling",g:"Action",c:["#0f2027","#2c5364"],r:8.6,y:2018,n:201,d:"-",tm:"",s:"Tamat",sy:"Pemburu terlemah menemukan sistem rahasia.",k:"Manhwa",img:"https://s4.anilist.co/file/anilistcdn/media/manga/cover/medium/bx105398-b673Vt5ZSuz3.jpg"},
{t:"Tower of God",g:"Fantasy",c:["#355c7d","#6c5b7b"],r:8.4,y:2010,n:544,d:"-",tm:"",s:"Tamat",sy:"Anak laki-laki memanjat menara misterius.",k:"Manhwa",img:"https://s4.anilist.co/file/anilistcdn/media/manga/cover/medium/bx85143-23oup3ETbFJk.jpg"},
{t:"Omniscient Reader",g:"Action",c:["#42275a","#734b6d"],r:8.5,y:2020,n:210,d:"-",tm:"",s:"Tamat",sy:"Novel favoritnya berubah menjadi kenyataan.",k:"Manhwa",img:"https://s4.anilist.co/file/anilistcdn/media/manga/cover/medium/bx119257-Pi21aq3ey9GG.jpg"},
{t:"Noblesse",g:"Action",c:["#8e2de2","#4a00e0"],r:8.2,y:2007,n:544,d:"-",tm:"",s:"Tamat",sy:"Bangsawan bangun di dunia modern.",k:"Manhwa",img:"https://s4.anilist.co/file/anilistcdn/media/manga/cover/medium/bx59983-cfSjrRxuAlAD.png"}];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const grad=a=>`background:linear-gradient(145deg,${a.c[0]},${a.c[1]})`;
const poster=(a,i)=>`<div class="pst"><div class="im" style="${grad(a)}">${a.img?`<img src="${a.img}" alt="${a.t}" loading="lazy" onerror="this.remove()">`:""}<span class="bdg">${ty(a)=="Manhwa"?"CH":"EP"} ${a.n}</span></div><p>${a.t}</p></div>`;
const tabs=[["beranda","⌂","Beranda"],["jelajahi","◎","Jelajahi"]];
$("#nav").innerHTML=tabs.map(t=>`<div data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</div>`).join("");
function go(id){$$(".scr").forEach(e=>e.classList.toggle("on",e.id==id));$$("#nav div").forEach(e=>e.classList.toggle("on",e.dataset.t==id));$$(".ovl").forEach(e=>e.classList.remove("on"))}
$("#nav").onclick=e=>{const d=e.target.closest("div");if(d)go(d.dataset.t)};
let hi=0,cat="Semua";
const ty=a=>a.k||"Anime";
const fl=()=>A.map((a,i)=>[a,i]).filter(x=>cat=="Semua"||ty(x[0])==cat);
function setCat(c){cat=c;hi=0;home();jelajahi()}
/* PENTING: bar kategori asli Guoke — cuma 3 tab. Tab ke-4 disuntik oleh tiktok-quality.js */
const CT=c=>["Semua","Anime","Manhwa"].map(x=>`<b class="${x==cat?"on":""}" onclick="setCat('${x}')">${x}</b>`).join("");
function home(){const F=fl(),H=F[hi%F.length];$("#beranda").innerHTML=`
<div class="demo-note">Demo integrasi Guoke — tab <b>Upload TikTok Quality</b> di bawah disuntik otomatis oleh <b>tiktok-quality.js</b>, bukan dari kode halaman ini.</div>
<div class="brand"><b>Guoke</b></div>
<div class="search">⌕<input placeholder="Cari anime, manhwa..."></div>
<div class="tabs">${CT()}</div>
<div class="hero" style="${grad(H[0])}"><h2>${H[0].t}</h2><p>${H[0].sy}</p></div>
<div class="dots">${F.map((_,i)=>`<i class="${i==hi%F.length?"on":""}"></i>`).join("")}</div>
<div class="row"><h2>Episode Terbaru</h2><a>Lihat Semua</a></div>
<div class="scroll">${F.map(([a,i])=>poster(a,i)).join("")}</div>
<div class="row"><h2>Update Manhwa</h2><a>Komiku</a></div>
<div class="scroll">${A.map((a,i)=>[a,i]).filter(([a])=>a.k).map(([a,i])=>poster(a,i)).join("")}</div>`}
function jelajahi(){$("#jelajahi").innerHTML=`<h1>Jelajahi</h1><div class="search">⌕<input placeholder="Cari judul"></div><div class="tabs">${CT()}</div><div class="grid">${A.map((a,i)=>[a,i]).filter(x=>cat=="Semua"||ty(x[0])==cat).map(([a,i])=>poster(a,i)).join("")}</div>`}
home();jelajahi();go("beranda");
</script>
<script src="untuk-guoke/tiktok-quality.js?v=demo"></script>
</body>
</html>
