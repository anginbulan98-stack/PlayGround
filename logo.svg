<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Logo Guoke AMHDQ - GAnimeH Yosh">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd0f5"/>
      <stop offset=".5" stop-color="#c9a9e8"/>
      <stop offset="1" stop-color="#f5a3c8"/>
    </linearGradient>
    <radialGradient id="skin" cx=".5" cy=".4" r=".8">
      <stop offset="0" stop-color="#ffe9d6"/>
      <stop offset="1" stop-color="#ffd9bd"/>
